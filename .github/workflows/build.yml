name: build

on:
  workflow_dispatch:
    inputs:
      subversion:
        description: 'Sub-version (eg: 57)'
        default: '57'
      platform:
        description: 'Target platform'
        default: 'android'
        type: choice
        options:
        - android
        - ios
        - windows
        - multiplatform

jobs:
  build:
    runs-on: ${{ (inputs.platform == 'windows' || inputs.platform == 'multiplatform') && 'windows-2022' || 'ubuntu-latest' }}
    steps:
    - uses: actions/checkout@v7

    - name: Ekstrak zip (jika repo hanya berisi zip)
      shell: bash
      run: |
        if ! find . -name build.sh -not -path "./.git/*" | grep -q .; then
          for f in $(find . -maxdepth 2 -name "*.zip" -not -path "./.git/*"); do
            if unzip -l "$f" | grep -q "build.sh"; then
              mkdir -p _src && unzip -q "$f" -d _src
              break
            fi
          done
        fi

    - name: Cari folder proyek
      shell: bash
      run: |
        dir=$(find . -name requirements.txt -not -path "./.git/*" | while read -r f; do d=$(dirname "$f"); [ -f "$d/build.sh" ] && echo "$d" && break; done)
        if [ -z "$dir" ]; then
          echo "::error::requirements.txt + build.sh tidak ditemukan. Isi repo:"
          find . -not -path "./.git/*" | head -50
          exit 1
        fi
        echo "PROJECT_DIR=$dir" >> "$GITHUB_ENV"
        echo "Folder proyek: $dir"

    - uses: actions/setup-python@v7
      with:
        python-version: '3.14'

    - uses: actions/cache@v6
      with:
        key: env-files-${{ (inputs.platform == 'windows' || inputs.platform == 'multiplatform') && 'win' || 'linux' }}-laz
        path: ${{ env.PROJECT_DIR }}/tool/data

    - name: Install dependencies
      working-directory: ${{ env.PROJECT_DIR }}
      run: pip install -r requirements.txt

    - name: Build (Linux)
      if: ${{ inputs.platform == 'android' || inputs.platform == 'ios' }}
      working-directory: ${{ env.PROJECT_DIR }}
      run: |
        bash build.sh setup
        bash build.sh pack -p ${{ inputs.platform }} -v ${{ inputs.subversion }} --no-zip

    - name: Build (Windows)
      if: ${{ inputs.platform == 'windows' || inputs.platform == 'multiplatform' }}
      working-directory: ${{ env.PROJECT_DIR }}
      run: |
        .\build.bat setup
        .\build.bat pack -p ${{ inputs.platform }} -v ${{ inputs.subversion }} --no-zip

    - name: Cek isi pack
      shell: bash
      working-directory: ${{ env.PROJECT_DIR }}
      run: |
        find build/pack-${{ inputs.platform }} -type f | sort
        cat build/pack-${{ inputs.platform }}/manifest.json

    - name: Zip jadi .mcpack
      shell: bash
      working-directory: ${{ env.PROJECT_DIR }}
      run: |
        python -c "import shutil; shutil.make_archive('Glowing_Ore_Shadow-${{ inputs.platform }}', 'zip', 'build/pack-${{ inputs.platform }}')"
        mv Glowing_Ore_Shadow-${{ inputs.platform }}.zip Glowing_Ore_Shadow-${{ inputs.platform }}.mcpack

    - uses: actions/upload-artifact@v4
      with:
        name: Glowing_Ore_Shadow-${{ inputs.platform }}
        path: ${{ env.PROJECT_DIR }}/Glowing_Ore_Shadow-${{ inputs.platform }}.mcpack
